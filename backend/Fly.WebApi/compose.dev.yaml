version: "3.8"

services:
  fly.webapi:
    build:
      context: ../..
      dockerfile: backend/Fly.WebApi/Dockerfile
    ports:
      - "5000:4442"  # http://localhost:5000
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  mysql:
    image: mysql:8.0
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: erp_mmtech_20032025
      MYSQL_USER: Admin
      MYSQL_PASSWORD: 959924
      MYSQL_ROOT_PASSWORD: 959924
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./my.conf:/etc/mysql/conf.d/my.cnf

volumes:
  mysql_data_dev:
