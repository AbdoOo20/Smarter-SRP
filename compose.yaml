services:
  fly.webapi:
    image: fly.webapi
    build:
      context: .
      dockerfile: backend/Fly.WebApi/Dockerfile
    depends_on:
      - mysql
    expose:
      - "4442"
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: erp_mmtech_20032025
      MYSQL_USER: Admin
      MYSQL_PASSWORD: 959924
      MYSQL_ROOT_PASSWORD: 959924
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
  nginx:
    image: nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "4443:4443"
    depends_on:
      - fly.webapi

volumes:
  mysql_data: